<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages</title>
    <link rel="stylesheet" href="style12.css">
</head>
<body>

    <div class="container">
        <div class="message error">
            <img src="error2.jpg" alt="error">
            <span>This is an error Message</span>
        </div>
        <div class="message success">
            <img src="success2.jpg" alt="success">
            <span>This is a success Message</span>
        </div>
        <div class="message alert">
            <img src="alert.jpg" alt="alert">
            <span>This is an alert Message</span>
        </div>
        <div class="message information">
            <img src="information.jpg" alt="information">
            <span>This is an information Message</span>
        </div>
    </div>

</body>
</html>
