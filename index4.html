<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>
    <div class="container">
        <div class="column">
            <div class="circle red">✕</div>
            <div class="card">
                <h3>WRITE A REVIEW</h3>
                <div class="stars gray">★★★★★</div>
                <textarea placeholder=""></textarea>
                <div class="btn-group">
                    <button class="btn-cancel">Cancel</button>
                    <button class="btn-post">Post</button>
                </div>
            </div>
        </div>

        <div class="column">
            <div class="circle green">✓</div>
            <div class="card">
                <h3>WRITE A REVIEW</h3>
                <label>Score:</label>
                <div class="stars yellow">★★★★★</div>
                <label>Review:</label>
                <textarea placeholder="Excellent Service!"></textarea>
                <div class="btn-group">
                    <button class="btn-cancel">Cancel</button>
                    <button class="btn-post">Post</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
