<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification</title>
    <link rel="stylesheet" href="style6.css">
</head>
<body>

    <div class="container">
        
        <div class="card card-line success">
            <img src="1.jpg" alt="Success" class="icon">
            <div class="text-box">
                <h3>Success</h3>
                <p>Your account has been saved</p>
            </div>
            <button class="close-btn">CLOSE</button>
        </div>

        <div class="card card-line error">
            <img src="2.jpg" alt="Error" class="icon">
            <div class="text-box">
                <h3>Error</h3>
                <p>Your email address is invalid</p>
            </div>
            <button class="close-btn">CLOSE</button>
        </div>

        <div class="card card-block success">
            <div class="color-side">
                <img src="3.jpg" alt="Success" class="icon">
            </div>
            <div class="text-box">
                <h3>Success</h3>
                <p>Your account has been saved</p>
            </div>
            <button class="close-btn">CLOSE</button>
        </div>

        <div class="card card-block error">
            <div class="color-side">
                <img src="4.jpg" alt="Error" class="icon">
            </div>
            <div class="text-box">
                <h3>Error</h3>
                <p>Your email address is invalid</p>
            </div>
            <button class="close-btn">CLOSE</button>
        </div>

    </div>

</body>
</html>
