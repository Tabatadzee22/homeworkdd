<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <button class="close-btn">×</button>
            <div class="circle success-circle">
                <img src="success.jpg" alt="Success">
            </div>
            <h3>Success!</h3>
            <p>Everything is working<br>normally.</p>
            <button class="btn success-btn">CONTINUE</button>
        </div>

        <div class="card">
            <button class="close-btn">×</button>
            <div class="circle error-circle">
                <img src="error.jpg" alt="Error">
            </div>
            <h3>Error!</h3>
            <p>Oops!<br>Something went wrong!</p>
            <button class="btn error-btn">TRY AGAIN</button>
        </div>
    </div>
</body>
</html>
